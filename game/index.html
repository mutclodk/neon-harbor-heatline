<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>NEON HARBOR: HEATLINE</title>
  <style>
    :root {
      --bg: #090a10;
      --panel-bg: rgba(12, 15, 26, 0.78);
      --panel-border: rgba(255, 42, 126, 0.35);
      --panel-glow: 0 0 18px rgba(255, 42, 126, 0.18), inset 0 0 14px rgba(0, 240, 255, 0.08);
      --pink: #ff2a7e;
      --cyan: #00f0ff;
      --orange: #ff8400;
      --amber: #ffb703;
      --text: #f0f4ff;
      --muted: #8b9bb4;
      --track: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
    }

    #render-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
    }

    #ui-root, .ui-root {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
    }

    .ui-hidden {
      display: none !important;
    }

    .ui-hud-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .ui-status-cluster,
    .ui-mission-panel,
    .ui-wanted-cluster,
    .ui-context-panel {
      position: absolute;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      box-shadow: var(--panel-glow);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 8px;
      pointer-events: auto;
    }

    .ui-status-cluster {
      top: 24px;
      left: 24px;
      padding: 12px 18px;
      display: grid;
      grid-template-columns: auto auto;
      column-gap: 16px;
      row-gap: 2px;
      align-items: baseline;
    }

    .ui-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .ui-value {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-align: right;
    }

    .ui-cash-value {
      color: var(--cyan);
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.45);
    }

    .ui-score-value {
      color: var(--orange);
      text-shadow: 0 0 10px rgba(255, 132, 0, 0.45);
    }

    .ui-mission-panel {
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      min-width: 320px;
      max-width: 480px;
      text-align: center;
      border-color: rgba(0, 240, 255, 0.4);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.18), inset 0 0 12px rgba(255, 42, 126, 0.08);
    }

    .ui-mission-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 4px;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
    }

    .ui-mission-objective {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.3;
    }

    .ui-mission-timer {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.08em;
      color: var(--pink);
      margin-top: 6px;
      text-shadow: 0 0 12px rgba(255, 42, 126, 0.6);
    }
