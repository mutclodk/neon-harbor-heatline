<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON HARBOR: HEATLINE</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌴</text></svg>">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0f172a;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  #game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    outline: none;
  }
  #hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }
  #minimap-wrapper {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.65);
    pointer-events: none;
    z-index: 12;
  }
  #minimap {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 50%;
  }
  #ui {
    position: fixed;
    inset: 0;
    z-index: 50;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js"
  }
}
</script>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div>
<div id="minimap-wrapper">
  <canvas id="minimap" width="180" height="180"></canvas>
</div>
<div id="ui"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
